name: Release Smokey

on:
  push:
    branches:
      - release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: vars
        run: |
          VERSION=$(grep -o 'SMOKEY_VERSION="[0-9]\+\.[0-9]\+\.[0-9]\+"' smokey.sh | cut -d'"' -f2)
          if [[ -z "${VERSION}" ]]; then
            echo "SMOKEY_VERSION not found" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build package and site
        run: ./package-deb.sh "${{ steps.vars.outputs.version }}"

      - name: Create git tag
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping" >&2
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: Smokey v${{ steps.vars.outputs.version }}
          files: |
            dist/smokey_${{ steps.vars.outputs.version }}_amd64.deb
            dist/smokey_${{ steps.vars.outputs.version }}.sh
          draft: false
          prerelease: false

      - name: Publish site to pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: ./site
          commit_message: Publish site for v${{ steps.vars.outputs.version }}
